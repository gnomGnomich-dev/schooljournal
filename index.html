<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Электронный журнал — Вход</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Дополнительные стили для страницы входа */
    body {
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 450px;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo h1 {
      font-size: 2.5rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .logo p {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2c3e50;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #3498db;
    }
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #2980b9;
    }
    .links {
      margin-top: 25px;
      font-size: 14px;
    }
    .links a {
      color: #3498db;
      text-decoration: none;
      margin: 0 5px;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <h1>📚 ЭлЖур</h1>
        <p>Электронный журнал школы</p>
      </div>
      <form class="login-form">
        <div class="form-group">
          <label for="login">Логин или email</label>
          <input type="text" id="login" placeholder="ivanov@mail.ru" required />
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
        <div class="links">
          <a href="#">Забыли пароль?</a> •
          <a href="#">Войти через Госуслуги</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
